spring:
  application:
    name: media-pipeline-lite

  datasource:
    url: jdbc:h2:mem:mediapipeline
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

  data:
    redis:
      host: localhost
      port: 6379

      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

      timeout: 3000ms
      connect-timeout: 5000ms

  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false
      use-key-prefix: true
      key-prefix: "media-pipeline:"

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

    consumer:
      group-id: analytics-consumer-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "*"

    listener:
      ack-mode: manual

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

media-pipeline:
  segment-duration-seconds: 6
  hls:
    master-playlist-name: master.m3u8
    media-playlist-name: playlist.m3u8
  quality-profiles:
    - height: 480
      width: 854
      bitrate: 1500000
      codecs: "avc1.42E01E,mp4a.40.2"
      level: "3.0"
    - height: 720
      width: 1280
      bitrate: 3000000
      codecs: "avc1.4D401F,mp4a.40.2"
      level: "3.1"
    - height: 1080
      width: 1920
      bitrate: 6000000
      codecs: "avc1.640028,mp4a.40.2"
      level: "4.0"
    - height: 2160
      width: 3840
      bitrate: 15000000
      codecs: "avc1.640033,mp4a.40.2"
      level: "5.1"
